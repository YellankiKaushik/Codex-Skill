name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: CLI launches
        run: ggcp --version
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate manifests
        run: python -m json.tool plugin.json && python -m json.tool .codex-plugin/plugin.json && python -m json.tool .agents/plugins/marketplace.json
      - name: Windows PowerShell tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./skills/granular-git-commit-push/scripts/Test-Skill.ps1
          ./tests/Invoke-IntegrationTests.ps1
